<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seu Método Cobra Certo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c23a5b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe4; --card:#fffdf9; --ink:#3a2a22; --ink-soft:#8a7869; --line:#e8ddcb;
    --berry:#c23a5b; --caramel:#dd9455; --cream:#fbf5ea;
    --shadow:0 12px 30px rgba(120,70,50,.12);
    --disp:"Fraunces",Georgia,serif; --body:"Nunito",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
    font-size:17px;line-height:1.6;padding:0 0 50px}
  .wrap{max-width:600px;margin:0 auto;padding:0 20px}
  h1{font-family:var(--disp);font-weight:800;line-height:1.15;margin:0}
  header{padding:34px 0 18px;text-align:center}
  .logo{font-size:15px;font-weight:800;color:var(--berry);text-transform:uppercase;letter-spacing:1px}
  h1{font-size:clamp(24px,6vw,30px);margin:10px 0 8px}
  .sub{color:var(--ink-soft);font-size:16px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:22px 20px;box-shadow:var(--shadow);margin:18px 0}
  .links{display:flex;flex-direction:column;gap:10px}
  .links a{display:flex;align-items:center;gap:11px;background:var(--cream);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
  .links a .ic{font-size:20px}
  .links a small{display:block;color:var(--ink-soft);font-weight:600;font-size:13px;margin-top:1px}
  footer{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<header class="wrap">
  <span class="logo">🎂 Lucro Doceira</span>
  <h1>Seu Método Cobra Certo</h1>
  <p class="sub">Obrigada pela confiança. Aqui está seu acesso.</p>
</header>
<div class="wrap">
  <div class="card">
    <div class="links">
      <a href="produto/upsell-cobrar-mais.html"><span class="ic">💎</span><span>Método Cobra Certo<small>Scripts pra defender seu preço sem perder cliente</small></span></a>
    </div>
  </div>
  <footer>Ficou com dúvida? Responde o e-mail que você recebeu da compra.</footer>
</div>
</body>
</html>
